<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Наша Команда - MLVCH</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link rel="stylesheet" href="team.css">
</head>
<body>
    <div class="main-wrapper">
        <header>
            <nav>
                <a href="index.html" class="MLVCH-header">MLVCH</a>
                <div class="header">
                    <span><a href="index.html">Головна</a></span>
                    <span><a href="about.html">Про нас</a></span>
                    <span><a href="team.html" class="active">Команда</a></span>
                </div>
            </nav>
        </header>

        <section class="team">
            <div class="team-container">
                <h2>Наша команда</h2>
                <div class="underline"></div>
                <div class="swiper team-slider">
                    <div class="swiper-wrapper">
                        <div class="swiper-slide">
                            <div class="master-card">
                                <img src="img/juli.jpg" alt="Гриньова Софія">
                                <div class="master-info">
                                    <h3>Гриньова Софія</h3>
                                    <p>Адміністратор</p>
                                </div>
                            </div>
                        </div>
                        </div>
                </div>
                <div class="team-controls">
                    <div class="swiper-pagination team-pagination"></div>
                    <div class="team-navigation">
                        <div class="swiper-button-prev team-prev"></div>
                        <div class="swiper-button-next team-next"></div>
                    </div>
                </div>
            </div>
        </section>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
